<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Stackly</title>
<meta name="description" content="This page took a wrong turn. Head back to Stackly and get back on the road.">
<meta name="robots" content="noindex">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= PRELOADER ================= -->
<div class="preloader" id="preloader">
  <div class="preloader-logo">
    <img src="Assest/logo-bone.webp" alt="Stackly">
  </div>
  <div class="preloader-bar"><span></span></div>
</div>

<!-- ================= CUSTOM CURSOR ================= -->
<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- ================= CORNER LOGO ================= -->
<a href="index.html" class="nf-corner-logo" aria-label="Stackly home">
  <img src="Assest/logo-bone.webp" alt="Stackly logo">
</a>

<main>

<!-- ================= 404 ================= -->
<section class="nf-hero" id="notfound">
  <div class="nf-bg">
    <div class="nf-glow"></div>
    <div class="nf-road"><span class="nf-road-line"></span></div>
  </div>

  <div class="nf-content">
    <p class="hero-kicker"><i class="fa-solid fa-route"></i> Route not found</p>

    <div class="nf-sign" aria-hidden="true">
      <span>4</span><span>0</span><span>4</span>
    </div>

    <h1 class="section-title">This road doesn't lead anywhere.</h1>
    <p class="section-desc">The page you're after took a wrong turn, got towed, or never existed in the first place. Let's get you back on route.</p>

    <div class="nf-actions">
      <a href="index.html" class="login-btn nf-btn-lg"><i class="fa-solid fa-house"></i> Back to home</a>
      <button type="button" class="btn-outline" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i> Back to previous page</button>
    </div>

    <div class="nf-track" aria-hidden="true">
      <i class="fa-solid fa-car-side nf-car"></i>
    </div>
  </div>
</section>

</main>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="script.js"></script>
</body>
</html>
